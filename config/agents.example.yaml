tenant_id: acme
slack_team_id: T00000000
agents:
  # A front door: listing specialists makes an agent one. It answers general
  # questions and hands a specialist question to the right agent, which then
  # keeps the thread.
  concierge:
    version: 1
    name: Concierge
    description: General questions about the company.
    system_prompt: |
      You answer general questions. Hand specialist questions to the right agent.
    max_steps: 4
    specialists: [it-helper]
  it-helper:
    version: 1
    name: IT helper
    # A front door shows this to the model when it picks a specialist, so a
    # specialist needs one.
    description: Laptops, accounts, VPN, access and other IT requests.
    system_prompt: |
      You help employees with IT requests. Answer from the IT requests database and cite page links.
      When someone wants something done, use create_item; it will ask them to approve.
    max_steps: 6
    grants:
      notion:
        databases:
          - id: "00000000000000000000000000000000"
            name: IT requests
            properties:
              title: Name
              status: Status
              done_values: [Done]
              requested_by: Requested by
              request_id: Agent request ID
            # Stable Notion property IDs. Run `uv run python -m agentos.check_grants`
            # and paste the block it prints; the worker will not start without it.
            property_ids:
              title: title
              status: "<status property id>"
              requested_by: "<requested-by property id>"
              request_id: "<request id property id>"
        # Everything under each page below becomes this agent's knowledge, so
        # grant only pages the agent should answer from. The page must be shared
        # with the Notion integration.
        pages:
          - id: "00000000000000000000000000000000"
            name: IT knowledge base
    follow_up:
      poll_interval_minutes: 15
      stale_after_days: 3
      max_watch_days: 30
    approval:
      expires_after_hours: 72
      reminder_after_hours: 24
# DMs and mentions in channels not listed below land here.
default_agent: concierge
# Optional: a mention in one of these Slack channels goes straight to that agent.
# channels:
#   C0123456789: it-helper
