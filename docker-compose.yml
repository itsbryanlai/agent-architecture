# Local dependencies for the walking skeleton: Postgres (chat history,
# idempotency records, task links) and a Temporal dev server.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    ports:
      # Host port 55432, not 5432: a native Postgres often already holds 5432.
      - "55432:5432"
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
