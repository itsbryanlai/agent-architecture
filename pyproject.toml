[project]
name = "agentos"
version = "0.1.0"
description = "Walking skeleton: Slack agents that do work, on Temporal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "notion-client>=3.1.0",
    "psycopg[binary,pool]>=3.3.8",
    "pyyaml>=6.0.3",
    "slack-sdk>=3.46.0",
    "temporalio>=1.35.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Python only: the design docs' code samples are illustrative and stay as written.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
