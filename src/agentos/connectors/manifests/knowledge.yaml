# Knowledge search manifest. The tool is offered only to an agent that has
# Notion page grants; what it can find is limited to those pages.
connector: knowledge
tools:
  search_knowledge:
    risk: read
    description: >-
      Search the documents this agent was given access to. Returns numbered
      passages with their page titles. Every statement you take from a passage
      must end with that passage's number in square brackets, like [2]; an
      answer that uses a passage without its number is incomplete.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: What to look for, in plain words.
      required: [query]
