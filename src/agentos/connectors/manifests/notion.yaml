# Notion connector manifest. The runtime reads it (see agentos.connectors.manifest).
#
# risk: read | write_reversible | write_irreversible. A read tool runs at once. A tool whose
#   risk is a write is never run by the conversation: it becomes a task that asks the
#   requester to approve before anything is sent, whatever the tool is called.
# requester_scoped: the input field that names the person. The runtime fills it
#   in from the requester's Slack identity and removes it from the schema the
#   LLM sees, so the LLM can never choose whose records are read.
# idempotency: how a retried write avoids creating a duplicate, and which task carries the
#   write out. marker_property means the item carries a hidden text property holding the
#   idempotency key, and the connector queries for it before creating: the call becomes a
#   create-item task. marker_text means the comment ends with a short ref and the connector
#   looks for it in the page's comments before posting: the call becomes a comment task. A
#   write with any other method is refused, and a write activity stops when no write in the
#   manifests declares the method it implements.
# input_schema: the model's input is checked against it before anything runs; a missing,
#   unexpected or wrongly typed field becomes an error the model reads and can correct.
# offer_to_llm: false keeps a tool for runtime use only; the model cannot call it.
# low_risk: true marks a comment action an admin may let run without the requester's
#   approval (D-43), on an item the requester filed. Loading refuses the flag on any
#   create, append or replace; the default policy still asks for approval.
connector: notion
tools:
  search_items:
    risk: read
    description: >-
      Search the granted Notion databases for items whose title contains the
      query. Returns title, status and link for each match.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Words to look for in item titles.
      required: [query]

  my_items:
    risk: read
    requester_scoped: requester_email
    description: >-
      List the items the person asking has requested, with title, status and
      link. Use this for questions like "my open requests".
    input_schema:
      type: object
      properties:
        requester_email:
          type: string
          description: Email of the person whose items to list.
      required: [requester_email]

  create_item:
    risk: write_irreversible
    idempotency: marker_property
    description: >-
      Draft a new item in the request database. Nothing is created until the
      requester approves the draft in Slack.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Short title for the request.
        details:
          type: string
          description: What is needed and any useful context.
      required: [title, details]

  add_comment:
    risk: write_reversible
    idempotency: marker_text
    low_risk: true
    description: >-
      Draft a comment on an existing item. Nothing is posted until the
      requester approves the draft in Slack.
    input_schema:
      type: object
      properties:
        item:
          type: string
          description: Link or ID of the item to comment on, from search results.
        comment:
          type: string
          description: The comment text.
      required: [item, comment]

  get_item:
    risk: read
    offer_to_llm: false
    description: Read one item's title, status and link.
    input_schema:
      type: object
      properties:
        page_id:
          type: string
      required: [page_id]
