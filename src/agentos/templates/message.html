{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<h1>{{ title }}</h1>
<p class="error">{{ text }}</p>
{% if back %}<p><a href="{{ back }}">{% if back == "/login" %}Sign in with Slack{% else %}Back{% endif %}</a></p>

{% endblock %}
